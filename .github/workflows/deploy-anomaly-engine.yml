
name: Deploy PiAssist Anomaly Engine

on:
  push:
    branches:
      - main
    paths:
      - 'anomaly-engine/**'
      - '.github/workflows/deploy-anomaly-engine.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy anomaly engine
        uses: Azure/functions-action@v1
        with:
          app-name: piassistit-anomaly-engine
          package: ./anomaly-engine
          remote-build: true
