
# Docs: https://github.com/Azure/webapps-deploy
# Azure Actions: https://github.com/Azure/actions

name: Build and deploy Python app to Azure Web App - PiAssitIT

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'anomaly-engine/**'
      - '.github/workflows/deploy-anomaly-engine.yml'
      - '.github/workflows/main_piassitit.yml'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          if-no-files-found: error
          path: |
            .
            !antenv/
            !anomaly-engine/**
            !**/.venv/**
            !**/.venv-azure/**
            !**/.python_packages/**
            !**/__pycache__/**
            !**/local.settings.json
            !**/.env
            !**/deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5E1ED667EAC646C9A8FA480599D11723 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_146D008E9D0243CEB13DABE219BD2A81 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AFB04BD01B3049F885C83C422C5C7DE6 }}

      - name: Deploy to existing PiAssistIT Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'PiAssitIT'
          slot-name: 'Production'
